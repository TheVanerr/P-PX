# Sitede yalnız giriş ekranı (pwa/ klasörü) yayınlanır; program kodu ve veri sitede yoktur.
# Program, erişim anahtarıyla girildikten sonra bu deponun main dalından tarayıcıya iner (pwa/ppx-kabuk.js).
# Bir kez: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Giriş ekranı (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['pwa/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pwa
      - id: deployment
        uses: actions/deploy-pages@v5
