<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>P&amp;PX</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; padding: 12vh 16px; background: #14161b; color: #aab0bc; font: 14px/1.5 'Segoe UI', system-ui, sans-serif; text-align: center; }
    a { color: #8ab4ff; }
  </style>
</head>
<body>
  <p id="msg">Açılıyor…</p>
  <script>
    /* Program sayfaları sitede yoktur, cihazdaki programdan sunulur. Tam yenileme (Ctrl+Shift+R) bunu atlar ve buraya düşer:
       sayfa bir kez normal yenilenir. Program cihazda yoksa giriş ekranına gidilir. */
    (async () => {
      const at = location.pathname.indexOf('/app/');
      const home = at >= 0 ? location.origin + location.pathname.slice(0, at + 1) : null;
      const reg = navigator.serviceWorker ? await navigator.serviceWorker.getRegistration().catch(() => null) : null;
      if (home && reg && reg.active && !navigator.serviceWorker.controller) {
        const last = Number(sessionStorage.getItem('ppx_404') || 0);
        if (Date.now() - last > 10000) {
          sessionStorage.setItem('ppx_404', String(Date.now()));
          location.reload();
          return;
        }
      }
      const target = home || (reg && reg.scope);
      if (target) {
        location.replace(target);
        return;
      }
      const msg = document.getElementById('msg');
      msg.textContent = 'Sayfa bulunamadı. ';
      const a = document.createElement('a');
      a.href = '/';
      a.textContent = 'Ana sayfa';
      msg.appendChild(a);
    })();
  </script>
</body>
</html>
